server.servlet.session.cookie.secure=true
# Tomcat solo acepta estas cabeceras si el emisor coincide con la lista confiable.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_IP_REGEX:(?!)}
server.tomcat.remoteip.trusted-proxies=(?!)
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.redirect-context-root=false

# El proxy debe conservar un Host validado; no aceptar host/puerto reenviados.
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=
