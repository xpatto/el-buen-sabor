spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:./data/menu.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# Se ejecuta para cada conexión física nueva, antes de prestarla desde el pool.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
