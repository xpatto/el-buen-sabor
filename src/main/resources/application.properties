spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:./data/menu.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# Se ejecuta para cada conexión física nueva, antes de prestarla desde el pool.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.profiles.default=dev
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
